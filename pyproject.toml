[project]
name = "vector-checker"
version = "0.1.0"
description = "Сверка вектора признаков 1С с датафреймом модели (универсальный tool)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "pyarrow>=14.0.0",
]

[project.scripts]
vector-checker = "vector_checker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vector_checker*"]
